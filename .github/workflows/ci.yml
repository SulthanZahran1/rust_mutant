name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Windows TCE diagnostic
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_MUTANT_TCE_DUMP: '1'
        run: |
          cargo run --quiet -- --path tests/fixtures/tce --operators AOR --format json --threshold 0 --no-cache > "$env:TEMP\\rust-mutant-tce-debug.json"
          $original = Get-ChildItem -Path "$env:TEMP\\rust-mutant-tce" -Recurse -Filter original.normalized.ll | Select-Object -First 1
          if (-not $original) { throw 'TCE diagnostic did not produce normalized IR' }
          $mutant = Join-Path $original.DirectoryName mutant.normalized.ll
          Write-Output "--- ORIGINAL NORMALIZED IR: $($original.FullName) ---"
          Get-Content $original.FullName
          Write-Output "--- MUTANT NORMALIZED IR: $mutant ---"
          Get-Content $mutant
      - name: Unit and documentation tests
        # Contract tests mutate shared fixture scratch/report resources.
        run: cargo test --workspace -- --test-threads=1
      - name: Small fixture contract smoke test
        run: cargo run --release -- --path tests/fixtures/small --format json --quiet --threshold 0 --no-tce --no-cache
