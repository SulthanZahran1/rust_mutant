name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: rust-mutant
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rust-mutant.exe
            archive: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: rust-mutant
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: rust-mutant
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p rust-mutant
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/rust-mutant-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/rust-mutant-${{ matrix.target }}/rust-mutant
          tar -C dist -czf dist/rust-mutant-${{ matrix.target }}.tar.gz rust-mutant-${{ matrix.target }}
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/rust-mutant-${{ matrix.target }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/rust-mutant-${{ matrix.target }}/rust-mutant.exe"
          Compress-Archive -Path "dist/rust-mutant-${{ matrix.target }}" -DestinationPath "dist/rust-mutant-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-mutant-${{ matrix.target }}
          path: dist/rust-mutant-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rust-mutant-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum rust-mutant-* > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rust-mutant-*
            dist/SHA256SUMS

  crates-io:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Publish crates.io packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # The version comes from the tag (v1.2.3 -> 1.2.3), never a
          # hardcoded literal: a release tag that does not match the
          # workspace version fails closed instead of publishing stale
          # versions.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "tag version $TAG_VERSION does not match workspace version $WORKSPACE_VERSION" >&2
            exit 1
          fi
          wait_for_crate() {
            local crate="$1"
            local version="$2"
            for attempt in $(seq 1 30); do
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for ${crate}@${version} to appear on crates.io" >&2
            return 1
          }
          cargo publish --locked -p rust-mutant-tce
          wait_for_crate rust-mutant-tce "$TAG_VERSION"
          cargo publish --locked -p rust-mutant-core
          wait_for_crate rust-mutant-core "$TAG_VERSION"
          cargo publish --locked -p rust-mutant-runner
          wait_for_crate rust-mutant-runner "$TAG_VERSION"
          cargo publish --locked -p rust-mutant-report
          wait_for_crate rust-mutant-report "$TAG_VERSION"
          cargo publish --locked -p rust-mutant
