[workspace]
resolver = "2"
members = [
    "crates/rust-mutant-core",
    "crates/rust-mutant-runner",
    "crates/rust-mutant-report",
    "crates/rust-mutant-tce",
    "crates/rust-mutant",
]
exclude = [
    "tests/fixtures/small",
    "tests/fixtures/operator-probes",
    "tests/fixtures/medium",
    "tests/fixtures/large",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
walkdir = "2"
libc = "0.2"
rayon = "1"
